<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encomenda</title>
    <link rel="stylesheet" href="formulari.css">
</head>
<body>
    <div class="container">
        <h1>Encomenda de Doces</h1>

      
        <form> <div class="form-control">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" />
        </div>

        <div class="form-control">
            <label for="Email">Email:</label>
            <input tyle="email" id="email" />
        </div>

        <div class="form-control">
            <label for="senha">Senha:</label>
            <input tyle="password" id="senha" />
        </div>

        <div class="form-control">
            <label for="data">Data de nascimento</label>
            <input type="date" nome="date" />
        </div>

        <div class="form-control">
            <label for="tipo de doce">Tipo de doce</label>

            <select name="tipo de doce" id="tipo de doce">
                <option value="">Selecione</option>
                <option valeu="brigadeiro">Brigadeiro</option>
                <option valeu="brigadeiro">Beijinho</option>
                <option valeu="brownie">Brownie</option>
                <option valeu="bolo">Bolo</option>
            </select>

             <div class="form-control">
            <label for="tamanho">Tamanho</label>
              <select name="tamanho" id="tamanho">
                <option value="">Selecione</option>
                <option valeu="pequeno">Pequeno</option>
                <option valeu="medio">Médio</option>
                <option valeu="grande">Grande</option>
                <option valeu="festa">Festa</option>
            </select>

             <div class="form-control">
            <label for="sabor">Sabor</label>
             <select name="sabor" id="sabor">
                <option value="">Selecione</option>
                <option valeu="baunilha">Baunilha</option>
                <option valeu="limao">Limão</option>
                <option valeu="morango">Morango</option>
                <option valeu="chocolate">Chocolate</option>
            </select>

        </div>
    
    <div class="form-control">
        <button tyle="submit">Cadastrar</button>
        <button tyle="reset">Limpar</button>
    </div>
</form>
       
    </div>
</body>
</html>
